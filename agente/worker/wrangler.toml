name = "mizuki-agente"
main = "worker.js"
compatibility_date = "2026-09-01"

# Publica em mizuki-agente.<subdominio>.workers.dev. Explícito de propósito: sem esta
# linha o Wrangler liga por padrão e avisa em cada deploy.
workers_dev = true

# Desliga as Preview URLs. Elas dão a cada versão publicada um endereço público próprio,
# com o mesmo código e a mesma chave — superfície pública extra que este projeto não usa,
# porque o teste é feito com `wrangler dev` local.
preview_urls = false

# Tudo aqui é público — este arquivo vai para o GitHub.
# A chave da API NÃO entra aqui. Ela é secret, ver README.md.
[vars]
PROVEDOR = "gemini"               # "gemini" (free tier) ou "anthropic" (pago)

# Ordem medida, não chutada: testando um a um pelo /saude?modelo=..., o alias
# gemini-flash-latest não respondeu em 30s (aponta para o lançamento mais recente, que é
# o mais disputado) enquanto os pinados responderam na hora. Por isso um pinado é o
# principal, e o alias fica por último — ele não dá a melhor latência, mas é o único
# que nunca vira 404 por descontinuação, que foi como o gemini-2.5-flash morreu.
#
# Remedido em 23/09/2026, duas chamadas por modelo com uma pergunta real de visitante:
#   3.6-flash       503 em 4,2 s  ·  200 em 4,9 s
#   3.5-flash       200 em 31,4 s ·  503 em 34,8 s
#   3.1-flash-lite  200 em 5,1 s  ·  200 em 4,2 s
# O principal falha com frequência, mas falha rápido; o que importa é para onde cai. Com o
# 3.5-flash como primeira reserva, cada falha do principal virava 30 s de "Pensando". O
# flash-lite, o mais rápido e o único que respondeu as duas vezes, é agora a primeira.
MODELO = "gemini-3.6-flash"
MODELOS_RESERVA = "gemini-3.1-flash-lite,gemini-3.5-flash,gemini-flash-latest"

# Teto próprio de perguntas por dia que chegam à IA (o cache e as respostas sem IA da página
# não contam). Fica ABAIXO do limite real do free tier do Gemini de propósito: se o nosso
# teto estourar primeiro, o visitante recebe "o limite do dia acabou, as perguntas prontas
# continuam funcionando"; se for o do Google, um 429 de cota. O /saude mostra as duas
# contas — perguntas e chamadas ao provedor, por modelo —, porque uma pergunta pode custar
# mais de uma chamada. Medido em 23/09/2026: a cota acabou depois de algumas dezenas de
# chamadas entre todos os modelos.
LIMITE_DIARIO = "150"

# Prazos da chamada ao modelo, contados até a resposta começar. Medido: um modelo saudável
# responde em 4 a 5 s, e um congestionado fica pendurado até o prazo. Com o /consulta
# limitado a 20 s, 15 s por
# tentativa gastavam a primeira rodada inteira num pendurado e não sobrava tempo para a
# segunda; com 12 s, sobram uns 6 s para ela. Medir antes de mexer: /saude mostra os
# valores, a fila e as chamadas do dia, sem gastar chamada de modelo.
PRAZO_TENTATIVA_MS = "12000"
PRAZO_TOTAL_MS     = "40000"   # vale só para o /saude?testar=1

# Reserva atrasada, só no /consulta: se o principal não responder nesse tempo, o segundo
# da fila entra junto e fica quem responder primeiro; o perdedor é abortado. Medido: o
# principal saudável responde em 3 a 5 s, mas às vezes fica pendurado até os 15 s, e a
# pergunta levava 20 s. Com 6 s, esse caso cai para ~11 s e o caso normal nem dispara a
# reserva. Custa uma chamada extra ao provedor só nas perguntas lentas. "0" desliga.
ATRASO_RESERVA_MS  = "6000"

# Falha rápida. A consulta chegou a insistir por um minuto, em quatro rodadas, e a espera
# virou o problema. Agora: 20 s e duas rodadas (se os dois modelos rápidos devolvem "high
# demand", espera 1,5 s e tenta de novo com eles). Na falha, a página oferece na hora as
# três perguntas prontas mais parecidas, que não dependem da IA. Não há mais narração pela
# IA: o texto vem na frase do próprio plano. Para voltar ao comportamento anterior da
# consulta: 60000 e 4.
PRAZO_CONSULTA_MS  = "20000"
RODADAS_CONSULTA   = "2"

# Exemplos pergunta → plano no prompt do /consulta: só os mais parecidos com a pergunta,
# escolhidos de agente/conhecimento/exemplos.json. Os 18 inteiros custariam ~2,5 mil
# tokens em toda pergunta; quatro, ~600.
EXEMPLOS_NO_PROMPT = "4"

# Disjuntor: depois de 3 falhas seguidas (503 ou 429), a IA fica 5 min em pausa e o Worker
# responde 503 na hora, sem chamar o provedor — com o free tier fora do ar, cada pergunta
# esperava o prazo inteiro para cair no mesmo erro, e gastava chamadas nisso. O /saude
# mostra a pausa. "0" em DISJUNTOR_PAUSA_MS desliga.
DISJUNTOR_FALHAS   = "3"
DISJUNTOR_PAUSA_MS = "300000"

# KV: rate limit por IP, o registro do dia (perguntas, chamadas ao provedor por modelo e
# desfecho, tokens, reserva e disjuntor, numa chave só) e o cache de planos.
# Criar com:  wrangler kv namespace create CONTADORES
# e colar o id devolvido aqui.
[[kv_namespaces]]
binding = "CONTADORES"
id = "f1a1443b42d2416fbca09b468938f557"
